version: "3.9"

services:
  r-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sruthipyda/road-safety-api:1.0
    container_name: road_safety_r_api
    ports:
      - "8000:8000"
    volumes:
      # Mount data folder so updated CSVs are picked up without rebuilding
      - ./data:/app/data:ro
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
